<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settlement</title>

    <link rel="stylesheet" href="page5.css">
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="page">

        <header class="topbar">
            <div class="system-id">NX-0509 / 05</div>

            <div class="status">
                <span class="status-dot"></span>
                ONLINE
            </div>
        </header>


        <section class="hero">

            <div class="eyebrow">
                SETTLEMENT PROTOCOL
            </div>

            <h1>
                FINAL SUBJECT
            </h1>

            <div class="subject">
                Unauthorized use of authority
            </div>

            <div class="divider"></div>

        </section>


        <section class="network-section">

            <div class="network-title">
                <span>SETTLEMENT</span>
                <span class="network-code">NODE MATRIX // LIVE</span>
            </div>

            <div class="plexus">

                <canvas id="plexusCanvas"></canvas>

                <div id="labels"></div>

                <div class="core">
                    <div class="core-ring ring-one"></div>
                    <div class="core-ring ring-two"></div>
                    <div class="core-point"></div>
                </div>

            </div>

            <div class="proceeding">
                <span class="loader-dot"></span>
                <span id="processText">PROCEEDING</span>
            </div>

        </section>


        <section class="settlement-panel">

            <div class="panel-line">
                <span>STATUS</span>
                <strong id="statusText">ANALYZING</strong>
            </div>

            <div class="panel-line">
                <span>NETWORK</span>
                <strong>CONNECTED</strong>
            </div>

            <div class="panel-line">
                <span>SETTLEMENT</span>
                <strong id="settlementText">IN PROGRESS</strong>
            </div>

        </section>


        <div class="bottom-message" id="bottomMessage">
            SYNCHRONIZING NODES...
        </div>

    </main>

    <script src="page5.js"></script>

</body>
</html>
